[project]
name = "fred"
version = "0.1.0"
description = "API para processar listas do Volei Frederico"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "mcp[cli]>=1.0.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project.scripts]
fred-mcp = "app.mcp_server:main"
fred-mcp-http = "app.mcp_server:main_http"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
