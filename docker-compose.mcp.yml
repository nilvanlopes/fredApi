services:
  mcp:
    image: fred-api:latest
    env_file:
      - .env
    command: ["fred-mcp-http"]
    tty: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      fred:
        aliases:
          - fred-mcp
      n8n:

networks:
  fred:
    external: true
  n8n:
    external: true
