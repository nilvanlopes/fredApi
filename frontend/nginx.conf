worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location = /if/flow/fred-invalidation-flow/ {
            if ($host != login-fred.nilvanlopes.com) { return 404; }
            rewrite ^ /authentik-invalidation.html last;
        }
        location = /authentik-invalidation.html {
            if ($host != login-fred.nilvanlopes.com) { return 404; }
            internal;
            access_log off;
            default_type text/html;
            add_header Cache-Control no-store always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location = /authentik-invalidation.js {
            if ($host != login-fred.nilvanlopes.com) { return 404; }
            access_log off;
            alias /usr/share/nginx/html/authentik-invalidation.js;
            default_type application/javascript;
            add_header Cache-Control no-store always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy strict-origin-when-cross-origin always;
        }
        location /api/ {
            proxy_pass http://api:8000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header X-Fred-Client-IP $http_cf_connecting_ip;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
            proxy_http_version 1.1;
            proxy_read_timeout 60s;
            client_max_body_size 11m;
            add_header Cache-Control no-store always;
        }
        location /assets/ { expires 1y; add_header Cache-Control 'public, immutable'; try_files $uri =404; }
        location / { add_header Cache-Control no-cache; try_files $uri $uri/ /index.html; }
    }
}
