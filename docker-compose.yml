services:
  api:
    image: fred-api:latest
    build:
      context: .
    env_file:
      - .env
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    networks:
      default: {}
      traefik-local:
        aliases:
          - fred-api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fred
      POSTGRES_USER: fred
      POSTGRES_PASSWORD: fred
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fred -d fred"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:

networks:
  traefik-local:
    external: true
