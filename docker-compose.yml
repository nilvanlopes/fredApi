services:
  api:
    image: fred-api:latest
    build:
      context: .
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "1.00"
          memory: 512M
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      fred:
        aliases:
          - api
      traefik-local:
        aliases:
          - fred-api
      n8n:
        aliases:
          - fred-api

  mcp:
    image: fred-api:latest
    env_file:
      - .env
    command: ["fred-mcp-http"]
    tty: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    networks:
      fred:
        aliases:
          - fred-mcp
      n8n:

  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: fred
      POSTGRES_USER: fred
      POSTGRES_PASSWORD: fred
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fred -d fred"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      fred:
        aliases:
          - postgres

volumes:
  postgres_data:

networks:
  fred:
    driver: overlay
    attachable: true
  traefik-local:
    external: true
  n8n:
    external: true
