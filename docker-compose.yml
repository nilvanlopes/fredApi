services:
  api:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fred
      POSTGRES_USER: fred
      POSTGRES_PASSWORD: fred
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fred -d fred"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
